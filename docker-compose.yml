x-worker: &worker
  restart: unless-stopped
  build:
    context: .
    dockerfile: packages/worker/Dockerfile
  env_file: .env
  extra_hosts:
    - "metadata.google.internal:169.254.169.254"
    - "metadata.goog:169.254.169.254"
  depends_on:
    migrate:
      condition: service_completed_successfully
    clickhouse-migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1))"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota
      POSTGRES_DB: dota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dota -d dota"]
      interval: 2s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 2048M
        reservations:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota
      CLICKHOUSE_DB: dota
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "dota", "--password", "dota", "--query", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.70"
          memory: 4096M
        reservations:
          memory: 1024M

  # One-shot: apply dbmate migrations, then exit. Not the app image.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    working_dir: /app
    volumes:
      - ./db:/app/db
    command: ["--wait", "--url", "postgres://dota:dota@postgres:5432/dota?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: same dbmate image, ClickHouse migrations only.
  clickhouse-migrate:
    image: ghcr.io/amacneil/dbmate:2
    working_dir: /app
    volumes:
      - ./db:/app/db
    command:
      - "--wait"
      - "--url"
      - "clickhouse://dota:dota@clickhouse:9000/dota"
      - "--migrations-dir"
      - "db/clickhouse/migrations"
      - "--schema-file"
      - "db/clickhouse/schema.sql"
      - "up"
    depends_on:
      clickhouse:
        condition: service_healthy

  worker-live:
    <<: *worker
    environment:
      NODE_ENV: production
      PGURI: postgres://dota:dota@postgres:5432/dota?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota
      CLICKHOUSE_DATABASE: dota
      WORKER_PORT: "8080"
      WORKER_ROLE: live
      SERVICE_NAME: worker-live
    ports:
      - "3001:8080"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 768M
        reservations:
          memory: 256M

  worker-historical:
    <<: *worker
    environment:
      NODE_ENV: production
      PGURI: postgres://dota:dota@postgres:5432/dota?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota
      CLICKHOUSE_DATABASE: dota
      WORKER_PORT: "8080"
      WORKER_ROLE: historical
      SERVICE_NAME: worker-historical
    ports:
      - "3004:8080"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 768M
        reservations:
          memory: 256M

  worker-match-processing:
    <<: *worker
    environment:
      NODE_ENV: production
      PGURI: postgres://dota:dota@postgres:5432/dota?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota
      CLICKHOUSE_DATABASE: dota
      WORKER_PORT: "8080"
      WORKER_ROLE: match-processing
      SERVICE_NAME: worker-match-processing
    ports:
      - "3005:8080"
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 1536M
        reservations:
          memory: 512M

  parser:
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/parser/Dockerfile
    env_file: .env
    environment:
      PGURI: postgres://dota:dota@postgres:5432/dota?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_NATIVE: clickhouse:9000
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota
      CLICKHOUSE_DATABASE: dota
      PARSER_PORT: "8080"
      SERVICE_NAME: parser
    ports:
      - "3002:8080"
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
      - "metadata.goog:169.254.169.254"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: 4096M
        reservations:
          memory: 1024M

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PGURI: postgres://dota:dota@postgres:5432/dota?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dota
      CLICKHOUSE_PASSWORD: dota
      CLICKHOUSE_DATABASE: dota
      SERVER_PORT: "8080"
      CORS_ORIGINS: http://localhost:5173
      SERVICE_NAME: api
    ports:
      - "3000:8080"
    depends_on:
      worker-live:
        condition: service_healthy
      worker-historical:
        condition: service_healthy
      worker-match-processing:
        condition: service_healthy
      parser:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 384M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - worker-live
      - worker-historical
      - worker-match-processing
      - parser
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 768M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/collector-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.04"
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
