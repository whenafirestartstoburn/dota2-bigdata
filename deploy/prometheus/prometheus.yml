global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-live:8080"]
        labels:
          role: live
      - targets: ["worker-historical:8080"]
        labels:
          role: historical
      - targets: ["worker-match-processing:8080"]
        labels:
          role: match-processing

  - job_name: parser
    metrics_path: /metrics
    static_configs:
      - targets: ["parser:8080"]
